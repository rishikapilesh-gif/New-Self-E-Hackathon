services:
  - type: web
    name: ocean-pulse
    env: node
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run db:push --workspace=apps/api && npm run db:seed --workspace=apps/api && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: JWT_SECRET
        generateValue: true
      - key: DEMO_MODE
        value: "true"
      - key: AI_PROVIDER
        value: "fallback"
      - key: DATABASE_URL
        fromDatabase:
          name: ocean-pulse-db
          property: connectionString

databases:
  - name: ocean-pulse-db
    plan: free
    region: singapore
    databaseName: oceanpulse
    user: oceanpulse_admin
